name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp index.html app.js data.js sync.js style.css sw.js Sortable.min.js datesheets.json manifest.json www/
          cp icon-192.png icon-512.png www/
          cp -r .well-known www/ 2>/dev/null || true
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ENCODED_KEYSTORE" ]; then
            echo "Error: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          # Keystore ko absolute path par save kar rahe hain
          echo "$ENCODED_KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/castudyapp.jks"

      - name: Zip Web Assets for OTA Update
        run: |
          cd www
          zip -r ../update.zip .
          cd ..

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: castudyapp
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/castudyapp.jks" -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Generate Release Tag
        id: tag
        run: echo "tag=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            update.zip
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
